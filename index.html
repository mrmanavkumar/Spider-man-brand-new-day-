<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider-Man: Brand New Day | Teaser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            background-color: #000; 
            color: #fff; 
            font-family: sans-serif; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
            touch-action: manipulation;
        }

        /* Overlay Cover */
        #start-overlay { 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; 
            z-index: 9999; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #start-btn { 
            padding: 16px 36px; 
            background: transparent; 
            border: 2px solid #e50914; 
            color: #fff; 
            font-size: 1.2rem; 
            letter-spacing: 3px; 
            cursor: pointer; 
            border-radius: 6px;
            outline: none;
            font-weight: bold;
        }

        /* Scene Container */
        .scene { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            visibility: hidden;
            transition: opacity 1s ease-in-out; 
            padding: 20px;
        }

        .scene.active { 
            opacity: 1; 
            visibility: visible;
        }

        .center-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        /* Text Styling & Responsiveness */
        .fade-text { 
            font-size: clamp(1.4rem, 5vw, 2.2rem); 
            letter-spacing: 2px; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
        }

        .cinematic-phrase { 
            font-size: clamp(1.6rem, 6vw, 2.5rem); 
            letter-spacing: 3px; 
            font-weight: bold; 
            line-height: 1.3;
        }

        .date-white { 
            color: #ffffff; 
            font-weight: bold; 
            font-size: clamp(1.8rem, 7vw, 2.8rem); 
            margin-bottom: 12px; 
        }

        .title-sub { 
            font-style: italic; 
            color: #888; 
            font-size: clamp(1.2rem, 4.5vw, 1.8rem); 
        }

        .visible { opacity: 1 !important; }

        .thunder-text { 
            font-size: clamp(2rem, 8vw, 3.2rem); 
            letter-spacing: 3px; 
            font-weight: bold; 
        }

        /* Title Card */
        #title-text-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .marvel-tag {
            background: #e50914;
            color: #fff;
            padding: 2px 10px;
            font-size: clamp(0.7rem, 2.5vw, 0.9rem);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .spidey-title {
            font-size: clamp(2.8rem, 11vw, 5.5rem);
            color: #e21417;
            font-weight: 900;
            font-style: italic;
            letter-spacing: -1px;
            line-height: 0.95;
            text-shadow: 0px 3px 0px #0b2f75, -2px 2px 0px #0b2f75, 2px 2px 0px #0b2f75;
        }

        .spidey-sub {
            font-size: clamp(1.2rem, 5vw, 2.2rem);
            color: #ffcc00;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 8px;
        }

        .ticket-heading { 
            font-size: clamp(1.5rem, 5.5vw, 2.5rem); 
            color: #ffcc00; 
            font-weight: bold; 
            line-height: 1.4;
        }

        /* Word-by-Word Animation */
        .return-text { 
            font-size: clamp(1.4rem, 5.5vw, 2.2rem); 
            color: #fff; 
            letter-spacing: 1px; 
            font-weight: bold; 
            width: 100%;
            line-height: 1.5;
        }

        .word-span {
            opacity: 0;
            display: inline-block;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            margin: 0 4px;
        }

        .word-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Start Overlay Button -->
    <div id="start-overlay">
        <button id="start-btn">PLAY TEASER</button>
    </div>

    <!-- Scene 1: Intro -->
    <div id="scene-1" class="scene">
        <div class="center-content">
            <p class="fade-text date-white line-1a">17 December 2021</p>
            <p class="fade-text title-sub line-1b">Spider-Man: No Way Home</p>
        </div>
    </div>

    <!-- Scene 2 -->
    <div id="scene-2" class="scene">
        <div class="center-content">
            <p class="fade-text cinematic-phrase">THE WORLD MOVED ON...</p>
        </div>
    </div>

    <!-- Scene 3 -->
    <div id="scene-3" class="scene">
        <div class="center-content">
            <p class="fade-text cinematic-phrase">But one story...</p>
        </div>
    </div>

    <!-- Scene 4 -->
    <div id="scene-4" class="scene">
        <div class="center-content">
            <p class="fade-text cinematic-phrase">Was only beginning.</p>
        </div>
    </div>

    <!-- Scene 5 -->
    <div id="scene-5" class="scene">
        <div class="center-content">
            <p class="fade-text thunder-text">5 Years Later...</p>
        </div>
    </div>

    <!-- Scene 6: SPIDER-MAN BRAND NEW DAY -->
    <div id="scene-6" class="scene">
        <div class="center-content">
            <div id="title-text-box">
                <p class="marvel-tag">MARVEL STUDIOS</p>
                <h1 class="spidey-title">SPIDER-MAN</h1>
                <p class="spidey-sub">BRAND NEW DAY</p>
            </div>
        </div>
    </div>

    <!-- Scene 7: TICKETS -->
    <div id="scene-7" class="scene">
        <div class="center-content">
            <h1 class="ticket-heading fade-text">🎟️ ADVANCED TICKETS BOOKED</h1>
        </div>
    </div>

    <!-- Scene 8: Final Word By Word Sentence -->
    <div id="scene-8" class="scene">
        <div class="center-content">
            <h2 class="return-text" id="word-container"></h2>
        </div>
    </div>

    <!-- Audio Tag -->
    <audio id="audio-bgm" src="bgm.mp3" preload="auto"></audio>

    <script>
        document.getElementById('start-btn').addEventListener('click', function() {
            // Hide Overlay
            document.getElementById('start-overlay').style.display = 'none';

            // Play Audio safely
            const bgm = document.getElementById('audio-bgm');
            if (bgm) {
                bgm.volume = 0.6;
                bgm.play().catch(function(err) {
                    console.log("Audio block error handled:", err);
                });
            }

            // Start Teaser Sequence
            runTeaserSequence(bgm);
        });

        function runTeaserSequence(bgm) {
            const s1 = document.getElementById('scene-1');
            const s2 = document.getElementById('scene-2');
            const s3 = document.getElementById('scene-3');
            const s4 = document.getElementById('scene-4');
            const s5 = document.getElementById('scene-5');
            const s6 = document.getElementById('scene-6');
            const s7 = document.getElementById('scene-7');
            const s8 = document.getElementById('scene-8');

            // --- Scene 1 ---
            s1.classList.add('active');
            setTimeout(() => { document.querySelector('.line-1a').classList.add('visible'); }, 300);
            setTimeout(() => { document.querySelector('.line-1b').classList.add('visible'); }, 1200);
            setTimeout(() => { s1.classList.remove('active'); }, 4500);

            // --- Scene 2 ---
            setTimeout(() => {
                s2.classList.add('active');
                setTimeout(() => s2.querySelector('.cinematic-phrase').classList.add('visible'), 300);
                setTimeout(() => s2.classList.remove('active'), 4500);
            }, 5000);

            // --- Scene 3 ---
            setTimeout(() => {
                s3.classList.add('active');
                setTimeout(() => s3.querySelector('.cinematic-phrase').classList.add('visible'), 300);
                setTimeout(() => s3.classList.remove('active'), 4500);
            }, 10000);

            // --- Scene 4 ---
            setTimeout(() => {
                s4.classList.add('active');
                setTimeout(() => s4.querySelector('.cinematic-phrase').classList.add('visible'), 300);
                setTimeout(() => s4.classList.remove('active'), 4500);
            }, 15000);

            // --- Scene 5 ---
            setTimeout(() => {
                s5.classList.add('active');
                setTimeout(() => s5.querySelector('.thunder-text').classList.add('visible'), 300);
                setTimeout(() => s5.classList.remove('active'), 4500);
            }, 20000);

            // --- Scene 6 ---
            setTimeout(() => {
                s6.classList.add('active');
                setTimeout(() => s6.classList.remove('active'), 4500);
            }, 25000);

            // --- Scene 7 ---
            setTimeout(() => {
                s7.classList.add('active');
                const h1 = s7.querySelector('.ticket-heading');
                setTimeout(() => h1.classList.add('visible'), 300);
                setTimeout(() => {
                    h1.classList.remove('visible');
                    s7.classList.remove('active');
                }, 4500);
            }, 30000);

            // --- Scene 8: Word By Word Reveal ---
            setTimeout(() => {
                s8.classList.add('active');
                
                const sentence = "I will return on 30 july in theatres";
                const words = sentence.split(" ");
                const container = document.getElementById('word-container');
                container.innerHTML = "";

                words.forEach((word) => {
                    const span = document.createElement('span');
                    span.className = 'word-span';
                    span.innerText = word;
                    container.appendChild(span);
                });

                const spans = container.querySelectorAll('.word-span');
                spans.forEach((span, idx) => {
                    setTimeout(() => {
                        span.classList.add('word-visible');
                    }, idx * 350);
                });

                // Fade Out Music
                setTimeout(() => {
                    if (bgm) {
                        let fade = setInterval(() => {
                            if (bgm.volume > 0.05) { bgm.volume -= 0.05; }
                            else { bgm.pause(); clearInterval(fade); }
                        }, 200);
                    }
                }, 3000);

            }, 35000);
        }
    </script>
</body>
</html>
